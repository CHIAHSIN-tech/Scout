<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuyList</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Scout CIS 配色（sage/linen/wheat）— 對照 scout_cis.html */
  --bg:#F5F0EA; --card:#FFFFFF; --ink:#3C3830; --muted:#6B6558; --faint:#A8A298;
  --line:#DCD8D0; --line-soft:#F5F0EA; --blue:#3D6B54; --blue-d:#2A4D3A;
  --green:#5C8C72; --amber:#C4915A; --red:#7A5230;
  --need:#7A5230; --want:#C4915A; --maybe:#6B6558;
  --r-lg:18px; --r-md:12px; --font:'Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;justify-content:center;padding:24px 14px 60px;}
.wrap{width:100%;max-width:640px;}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.26em;color:var(--faint);text-transform:uppercase;margin-bottom:6px;}
.title{font-weight:700;font-size:26px;letter-spacing:-.01em;}
.status{font-size:11.5px;color:var(--muted);margin-top:5px;}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);margin-right:5px;vertical-align:middle;}
.status.live .dot{background:var(--green);} .status.err .dot{background:var(--red);}
.me{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.me .who{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);}
.me .who button{font-family:inherit;font-size:12px;padding:6px 11px;border:none;background:transparent;color:var(--muted);cursor:pointer;}
.me .who button.on{background:var(--ink);color:#fff;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:0 1px 2px rgba(20,22,28,.05),0 8px 28px rgba(20,22,28,.05);}

.budget{padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.budget .blk{display:flex;flex-direction:column;gap:3px;}
.budget label{font-size:11px;color:var(--faint);font-weight:600;}
.budget input{width:120px;font-family:inherit;font-size:15px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;}
.budget input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(61,107,84,.15);}
.budget .big{font-size:20px;font-weight:700;letter-spacing:-.01em;}
.budget .sep{flex:1;}
.budget .remain.ok{color:var(--green);} .budget .remain.over{color:var(--red);}
.budget .hint{font-size:10.5px;color:var(--faint);width:100%;}
.budget .recur{font-size:11px;color:var(--amber);width:100%;font-weight:600;}

.addbox{padding:16px 18px;margin-bottom:14px;}
.addrow{display:flex;gap:9px;margin-bottom:11px;flex-wrap:wrap;}
.addbox input,.addbox select{font-family:inherit;font-size:14px;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;}
.addbox input:focus,.addbox select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(61,107,84,.15);}
#bl-name{flex:1;min-width:150px;} #bl-price{width:110px;} #bl-qty{width:78px;} #bl-cat{width:120px;} #bl-tag{width:132px;} #bl-recur{width:140px;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg);}
.seg button{font-family:inherit;font-size:12.5px;padding:8px 12px;border:none;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;}
.seg button.on{background:var(--ink);color:#fff;}
.seg.urg button.on[data-v=need]{background:var(--need);} .seg.urg button.on[data-v=want]{background:var(--want);}
.fieldlabel{font-size:11px;color:var(--faint);font-weight:600;margin:0 6px 0 2px;align-self:center;}
.segline{display:flex;gap:10px;align-items:center;margin-bottom:11px;flex-wrap:wrap;}
.tmtoggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);cursor:pointer;}
.tmtoggle input{width:16px;height:16px;}
.addbtn{font-family:inherit;font-weight:600;font-size:14px;padding:11px 22px;border-radius:999px;cursor:pointer;border:none;background:var(--blue);color:#fff;}
.addbtn:hover{background:var(--blue-d);}
/* 次要按鈕（貼連結帶入）：白底 sage 描邊，跟主要「加入」區隔 */
.addbtn.ghost{background:var(--card);color:var(--blue);border:1.5px solid var(--blue);padding:9.5px 18px;}
.addbtn.ghost:hover{background:#EAF2ED;}
.addbtn:disabled{opacity:.55;cursor:default;}
.btngroup{display:inline-flex;gap:8px;flex-wrap:wrap;}
.addbox .wide{width:100%;}
/* 批次貼多行：原生 details 可展開，不擠壓單筆表單 */
.bulkbox{border-top:1px solid var(--line-soft);margin-top:6px;padding-top:12px;}
.bulkbox summary{font-size:13px;color:var(--blue);font-weight:600;cursor:pointer;list-style:none;user-select:none;}
.bulkbox summary::-webkit-details-marker{display:none;}
.bulkbox summary::before{content:'＋ ';}
.bulkbox[open] summary::before{content:'－ ';}
.bulkbox textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;resize:vertical;min-height:78px;margin:10px 0;}
.bulkbox textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(61,107,84,.15);}

/* 篩選 / 排序列 */
.filters{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap;}
.filters .seg button{font-size:12.5px;padding:7px 13px;}
.filters .seg button.on{background:var(--blue);color:#fff;}
.filters select{font-family:inherit;font-size:12.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;outline:none;cursor:pointer;}
.viewtabs{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);margin-left:auto;}
.viewtabs button{font-family:inherit;font-weight:600;font-size:12.5px;padding:7px 14px;border:none;background:transparent;color:var(--muted);cursor:pointer;}
.viewtabs button.on{background:var(--blue);color:#fff;}

.list{display:flex;flex-direction:column;gap:9px;}
.item{padding:13px 15px;display:flex;align-items:flex-start;gap:12px;}
.item.bought .iname{text-decoration:line-through;color:var(--faint);}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;padding:0;margin-top:2px;}
.chk:hover{border-color:var(--green);} .chk.on{background:var(--green);border-color:var(--green);color:#fff;}
/* 星號收藏：只在已買項目顯示（.item.bought）；空心＝未收藏、實心 wheat＝值得回購 */
.star{flex:none;width:22px;height:22px;border:none;background:none;cursor:pointer;
  color:var(--faint);font-size:18px;padding:0;margin-top:2px;display:none;line-height:1;}
.item.bought .star{display:inline-flex;align-items:center;justify-content:center;}
.star.on{color:var(--amber);}
.star:hover{color:var(--amber);}
.ibody{flex:1;min-width:0;}
.itop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
.iname{font-size:15.5px;font-weight:600;word-break:break-word;}
.iprice{font-size:14px;font-weight:700;color:var(--ink);}
.iqty{font-size:13px;font-weight:600;color:var(--muted);}
.itags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.tag{font-size:10.5px;font-weight:600;border-radius:7px;padding:2px 8px;}
.tag.u-need{background:#E8C898;color:var(--need);} .tag.u-want{background:#FBF0E0;color:var(--want);} .tag.u-maybe{background:#F5F0EA;color:var(--muted);}
.tag.a-easy{background:#EAF2ED;color:#5C8C72;} .tag.a-os{background:#F5F0EA;color:#3C3830;} .tag.a-rare{background:#FBF0E0;color:#7A5230;}
.tag.cat{background:#F5F0EA;color:#A8A298;}
.tag.tm{background:#EAF2ED;color:var(--blue);} .tag.later{background:#F5F0EA;color:var(--muted);}
.tag.ctx{background:#DCE9E1;color:var(--blue-d);border:1px solid #C3D9CC;}
.tag.days{background:transparent;color:var(--faint);padding-left:0;}
.imeta{font-size:11px;color:var(--faint);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.imeta a{color:var(--blue);text-decoration:none;} .imeta a:hover{text-decoration:underline;}
.irecur{color:var(--amber);font-weight:600;}
.inote{font-size:12px;color:var(--muted);margin-top:4px;word-break:break-word;}
.idel{flex:none;background:none;border:none;color:var(--faint);cursor:pointer;font-size:16px;padding:2px 4px;margin-top:2px;}
.idel:hover{color:var(--red);}
.empty{padding:42px 16px;text-align:center;font-size:13px;color:var(--faint);line-height:1.8;}

.matrix{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;min-height:340px;margin-top:4px;}
.quad{border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;background:var(--card);}
.quad .qh{font-size:11px;font-weight:700;color:var(--muted);}
.quad.q-hi-need{background:#E8C898;border-color:#C4915A;} .quad.q-lo-need{background:#FBF0E0;border-color:#E8C898;}
.chip{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 9px;display:flex;justify-content:space-between;gap:8px;}
.chip .cp{color:var(--muted);font-weight:600;}
.maxis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:6px;padding:0 4px;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow">兩人即時共用</div>
      <div class="title">買物清單</div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">連線中…</span></div>
    </div>
    <div class="me">我是 <span class="who" id="whoSel"><button data-me="Stanley">Stanley</button><button data-me="Chia">Chia</button></span></div>
  </div>

  <div class="card budget">
    <div class="blk"><label>月預算（兩人共用）</label><input type="number" id="bl-budget" min="0" step="100" placeholder="0"></div>
    <div class="blk"><label>本月想買 · 未購總價</label><div class="big" id="bl-total">NT$ 0</div></div>
    <div class="sep"></div>
    <div class="blk" style="text-align:right;"><label>剩餘額度</label><div class="big remain" id="bl-remain">—</div></div>
    <div class="recur" id="bl-recur"></div>
    <div class="hint">只加總「本月想買 且 未購」。標記已買＝移出總價（不留帳）。每月初自動清掉上月「已買」。</div>
  </div>

  <div class="card addbox">
    <div class="addrow">
      <input type="text" id="bl-name" placeholder="想買什麼？（必填）" autocomplete="off">
      <input type="number" id="bl-price" placeholder="價格" min="0" step="1">
      <input type="number" id="bl-qty" placeholder="數量" min="1" step="1">
      <select id="bl-cat"></select>
      <input type="text" id="bl-tag" list="tag-list" placeholder="情境（選填）" autocomplete="off">
      <datalist id="tag-list"></datalist>
    </div>
    <div class="segline">
      <span class="fieldlabel">迫切度</span>
      <span class="seg urg" id="seg-urg"><button data-v="need">需要</button><button data-v="want">想要</button><button data-v="maybe" class="on">再看看</button></span>
      <span class="fieldlabel">取得</span>
      <span class="seg acc" id="seg-acc"><button data-v="tw_easy" class="on">台灣易</button><button data-v="overseas">需國外</button><button data-v="rare">稀有</button></span>
    </div>
    <div class="addrow">
      <input type="number" id="bl-recur" placeholder="後續成本/月（選填）" min="0" step="1">
      <input type="text" id="bl-link" placeholder="連結（選填）" autocomplete="off" style="flex:1;min-width:160px;">
    </div>
    <input type="text" id="bl-note" class="wide" placeholder="備註（選填）" autocomplete="off" style="margin-bottom:11px;">
    <div class="segline" style="justify-content:space-between;">
      <label class="tmtoggle"><input type="checkbox" id="bl-tm" checked>本月想買（取消＝之後再說）</label>
      <span class="btngroup">
        <button class="addbtn" id="bl-add">＋ 加入</button>
        <button class="addbtn ghost" id="bl-import" title="把商品連結貼到上面「連結」欄，按這裡自動帶入名稱與價格">🔗 貼連結帶入</button>
      </span>
    </div>
    <details class="bulkbox">
      <summary>一次貼多行批次新增</summary>
      <textarea id="bl-bulk" placeholder="一行一項，或用 、 , 分隔。例：衛生紙、洗髮精、咖啡豆"></textarea>
      <button class="addbtn ghost" id="bl-bulk-add">批次新增</button>
    </details>
  </div>

  <div class="filters">
    <span class="seg" id="f-status"><button data-v="all" class="on">全部</button><button data-v="month">本月</button><button data-v="bought">已買</button><button data-v="starred">已買・星號</button></span>
    <select id="f-cat"></select>
    <select id="f-tag"></select>
    <select id="f-sort"><option value="default">預設排序</option><option value="price">價格高→低</option><option value="days">想最久</option></select>
    <span class="viewtabs" id="viewtabs"><button data-view="list" class="on">清單</button><button data-view="matrix">2×2</button></span>
  </div>

  <div id="view-list" class="card" style="padding:6px 0;"><div class="list" id="list"></div></div>
  <div id="view-matrix" class="hidden">
    <div class="matrix" id="matrix"></div>
    <div class="maxis"><span>← 價格低</span><span>價格高 →</span></div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  const SUPABASE_URL='https://kdmmjlaajqxjmiahfvos.supabase.co';
  const SUPABASE_KEY='sb_publishable_iuUz3RtUoTErjeAunr0FJw_31jB7AAu';
  // Gemini 金鑰從 gitignored 的 config.js 讀（不寫死進版控）
  const GEMINI_KEY=(window.BUYLIST_CONFIG&&window.BUYLIST_CONFIG.GEMINI_API_KEY)||'';
  const GEMINI_MODEL=(window.BUYLIST_CONFIG&&window.BUYLIST_CONFIG.GEMINI_MODEL)||'gemini-2.5-flash';

  const URG={need:{label:'需要',cls:'u-need'},want:{label:'想要',cls:'u-want'},maybe:{label:'再看看',cls:'u-maybe'}};
  const ACC={tw_easy:{label:'台灣容易',cls:'a-easy'},overseas:{label:'需國外',cls:'a-os'},rare:{label:'稀有難找',cls:'a-rare'}};
  const CATS=['3C','家電','服飾','美妝','食品','生活','書籍','其他'];

  const $=id=>document.getElementById(id);
  const statusEl=$('status'), statusText=$('statusText');
  function setStatus(t,cls){statusText.textContent=t;statusEl.className='status'+(cls?' '+cls:'');}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function money(n){return 'NT$ '+(Math.round(+n||0)).toLocaleString('en-US');}
  function daysSince(iso){const d=Math.floor((Date.now()-new Date(iso).getTime())/86400000);return d<=0?'今天加入':('想買了 '+d+' 天');}
  function ageDays(iso){return Math.floor((Date.now()-new Date(iso).getTime())/86400000);}

  if(!window.supabase||!window.supabase.createClient){setStatus('Supabase 函式庫未載入','err');return;}
  const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

  let items=[], budget=0, view='list';
  let me=localStorage.getItem('buylist_me')||'';
  let addUrg='maybe', addAcc='tw_easy';
  let addingItem=false;
  let fStatus='all', fCat='all', fSort='default', fTag='all';

  // 下拉選單填充
  $('bl-cat').innerHTML=CATS.map(c=>'<option value="'+c+'">'+c+'</option>').join('');
  $('bl-cat').value='其他';
  $('f-cat').innerHTML='<option value="all">全部分類</option>'+CATS.map(c=>'<option value="'+c+'">'+c+'</option>').join('');

  function renderWho(){document.querySelectorAll('#whoSel button').forEach(b=>b.classList.toggle('on',b.dataset.me===me));}

  // ── 載入（含月初自動清已買）──
  async function loadAll(){
    const r2=await sb.from('buylist_budget').select('*').eq('id',1).maybeSingle();
    let brow=(r2 && !r2.error)?r2.data:null;
    const ym=new Date().toISOString().slice(0,7);
    if(brow){
      const lc=brow.last_cleared||'';
      if(lc && lc!==ym){ await sb.from('buylist_items').delete().eq('bought',true); }   // 跨月→清掉上月已買
      if(lc!==ym){ await sb.from('buylist_budget').update({last_cleared:ym}).eq('id',1); brow.last_cleared=ym; }
    }
    budget=brow?(+brow.monthly_budget||0):0;
    const r1=await sb.from('buylist_items').select('*').order('created_at');
    if(r1.error){setStatus('讀取失敗：'+r1.error.message,'err');return;}
    items=r1.data||[];
    renderAll();
  }

  function thisMonthUnbought(){return items.filter(i=>i.this_month && !i.bought);}

  function renderBudget(){
    const tmu=thisMonthUnbought();
    const total=tmu.reduce((s,i)=>s+(+i.price||0),0);
    $('bl-total').textContent=money(total);
    const bInput=$('bl-budget');
    if(document.activeElement!==bInput) bInput.value=budget?budget:'';
    const rem=$('bl-remain');
    if(!budget){rem.textContent='—';rem.className='big remain';}
    else{const diff=budget-total; if(diff>=0){rem.textContent=money(diff);rem.className='big remain ok';}
      else{rem.textContent='超支 '+money(-diff);rem.className='big remain over';}}
    const recur=tmu.reduce((s,i)=>s+(+i.recurring_cost||0),0);
    $('bl-recur').textContent=recur?('＋ 這些買下去每月後續成本約 '+money(recur)):'';
  }

  function tag(cls,txt){return '<span class="tag '+cls+'">'+txt+'</span>';}
  function visibleItems(){
    let arr=items.filter(i=>{
      if(fStatus==='month' && !(i.this_month && !i.bought)) return false;
      if(fStatus==='bought' && !i.bought) return false;
      if(fStatus==='starred' && !(i.bought && i.starred)) return false;   // 已買且加星
      if(fCat!=='all' && (i.category||'其他')!==fCat) return false;
      if(fTag!=='all' && (i.tag||'').trim()!==fTag) return false;
      return true;
    });
    const urgRank={need:0,want:1,maybe:2};
    // 已買永遠沉底：抽成套在三種排序之上的主鍵（未購 0 在前、已買 1 在後），群內再照各自排序鍵
    const boughtRank=i=>i.bought?1:0;
    if(fSort==='price') arr.sort((a,b)=>boughtRank(a)-boughtRank(b) || (+b.price||0)-(+a.price||0));
    else if(fSort==='days') arr.sort((a,b)=>boughtRank(a)-boughtRank(b) || ageDays(b.created_at)-ageDays(a.created_at));
    else arr.sort((a,b)=>{
      if(a.bought!==b.bought) return boughtRank(a)-boughtRank(b);   // 已買沉底（主鍵）
      if((a.this_month&&!a.bought)!==(b.this_month&&!b.bought)) return (b.this_month&&!b.bought)-(a.this_month&&!a.bought);
      if((urgRank[a.urgency]??9)!==(urgRank[b.urgency]??9)) return (urgRank[a.urgency]??9)-(urgRank[b.urgency]??9);
      return new Date(b.created_at)-new Date(a.created_at);
    });
    return arr;
  }
  function renderList(){
    const box=$('list'); const arr=visibleItems();
    if(!arr.length){box.innerHTML='<div class="empty">沒有符合的項目。<br>上面加一個，或換個篩選看看。</div>';return;}
    box.innerHTML=arr.map(i=>{
      const u=URG[i.urgency]||URG.maybe, a=ACC[i.accessibility]||ACC.tw_easy;
      const tags=tag(u.cls,u.label)+tag(a.cls,a.label)+tag('cat',esc(i.category||'其他'))
        +((i.tag||'').trim()?tag('ctx','📍'+esc(i.tag.trim())):'')
        +(i.this_month?tag('tm','本月想買'):tag('later','之後再說'))+tag('days',daysSince(i.created_at));
      const meta=[];
      if(i.added_by) meta.push(esc(i.added_by)+' 加的');
      if(+i.recurring_cost>0) meta.push('<span class="irecur">每月後續 '+money(i.recurring_cost)+'</span>');
      if(i.link) meta.push('<a href="'+esc(i.link)+'" target="_blank" rel="noopener">🔗 連結</a>');
      return '<div class="item '+(i.bought?'bought':'')+'">'
        +'<button class="chk '+(i.bought?'on':'')+'" data-id="'+i.id+'" data-b="'+(i.bought?1:0)+'" title="標記已買">'+(i.bought?'✓':'')+'</button>'
        +(i.bought?'<button class="star '+(i.starred?'on':'')+'" data-id="'+i.id+'" data-s="'+(i.starred?1:0)+'" title="標記可回購">★</button>':'')
        +'<div class="ibody">'
          +'<div class="itop"><span class="iname">'+esc(i.name)+'</span>'+((+i.quantity>1)?'<span class="iqty">×'+(+i.quantity)+'</span>':'')+(i.price?'<span class="iprice">'+money(i.price)+'</span>':'')+'</div>'
          +'<div class="itags">'+tags+'</div>'
          +(meta.length?'<div class="imeta">'+meta.join('')+'</div>':'')
          +(i.note?'<div class="inote">'+esc(i.note)+'</div>':'')
        +'</div><button class="idel" data-del="'+i.id+'" title="刪除">✕</button></div>';
    }).join('');
    box.querySelectorAll('.chk').forEach(b=>b.addEventListener('click',()=>toggleBought(b.dataset.id,b.dataset.b!=='1')));
    box.querySelectorAll('.star').forEach(b=>b.addEventListener('click',()=>toggleStarred(b.dataset.id,b.dataset.s!=='1')));
    box.querySelectorAll('.idel').forEach(b=>b.addEventListener('click',()=>delItem(b.dataset.del)));
  }
  function renderMatrix(){
    const data=thisMonthUnbought();
    const prices=data.map(i=>+i.price||0).sort((a,b)=>a-b);
    const med=prices.length?prices[Math.floor(prices.length/2)]:0;
    const hiUrg=i=>i.urgency==='need'||i.urgency==='want';
    const hiPrice=i=>(+i.price||0)>=med && med>0;
    const cells={'lo-need':[],'hi-need':[],'lo-low':[],'hi-low':[]};
    data.forEach(i=>cells[(hiPrice(i)?'hi':'lo')+'-'+(hiUrg(i)?'need':'low')].push(i));
    const q=(k,t,c)=>{const l=cells[k].map(i=>'<div class="chip"><span>'+esc(i.name)+'</span><span class="cp">'+(i.price?money(i.price):'')+'</span></div>').join('')||'<div style="font-size:11px;color:var(--faint);">（空）</div>';return '<div class="quad'+c+'"><div class="qh">'+t+'</div>'+l+'</div>';};
    $('matrix').innerHTML=q('lo-need','迫切高 · 價格低',' q-lo-need')+q('hi-need','迫切高 · 價格高',' q-hi-need')+q('lo-low','迫切低 · 價格低','')+q('hi-low','迫切低 · 價格高','');
  }
  // 目前資料裡出現過的情境標籤（去空白、去重、排序）；分類是寫死的，情境是使用者自訂所以動態算
  function distinctTags(){return [...new Set(items.map(i=>(i.tag||'').trim()).filter(Boolean))].sort();}
  // 依現有資料重建「情境」篩選下拉與 autocomplete；保留當前選擇，選的標籤若消失則退回「全部情境」
  function renderTagOptions(){
    const tags=distinctTags();
    if(fTag!=='all' && !tags.includes(fTag)) fTag='all';
    $('f-tag').innerHTML='<option value="all">全部情境</option>'+tags.map(t=>'<option value="'+esc(t)+'">'+esc(t)+'</option>').join('');
    $('f-tag').value=fTag;
    $('tag-list').innerHTML=tags.map(t=>'<option value="'+esc(t)+'">').join('');
  }
  function renderAll(){renderTagOptions();renderBudget();renderList();renderMatrix();}

  // ── 動作 ──
  async function addItem(){
    if(addingItem) return;
    const name=($('bl-name').value||'').trim(); if(!name)return;
    addingItem=true;
    const rec={name, price:parseFloat($('bl-price').value)||0, urgency:addUrg, accessibility:addAcc,
      category:$('bl-cat').value||'其他', this_month:$('bl-tm').checked, bought:false,
      added_by:me||'', note:($('bl-note').value||'').trim(), link:($('bl-link').value||'').trim(),
      recurring_cost:parseFloat($('bl-recur').value)||0, quantity:parseInt($('bl-qty').value,10)||1,
      tag:($('bl-tag').value||'').trim()};
    ['bl-name','bl-price','bl-qty','bl-note','bl-link','bl-recur','bl-tag'].forEach(id=>$(id).value=''); $('bl-name').focus();
    const {error}=await sb.from('buylist_items').insert(rec);
    if(error)setStatus('新增失敗：'+error.message,'err');
    addingItem=false;
  }
  // ── 批次貼多行新增：以換行/頓號/逗號拆分，每筆只帶名稱走預設，一次 insert 陣列 ──
  let bulking=false;
  async function bulkAdd(){
    if(bulking) return;
    const raw=$('bl-bulk').value||'';
    // 分隔符：換行、頓號、半形逗號、全形逗號（可混用、連續視為一個）
    const names=raw.split(/[\n,、，]+/).map(s=>s.trim()).filter(Boolean);
    // 本次貼上內部去重（保序）；不與清單既有項目比對
    const seen=new Set(), uniq=[];
    for(const n of names){ if(!seen.has(n)){ seen.add(n); uniq.push(n); } }
    if(!uniq.length){ setStatus('沒有可新增的項目（內容是空的）','err'); return; }
    bulking=true;
    const rows=uniq.map(name=>({name, price:0, urgency:'maybe', accessibility:'tw_easy',
      category:'其他', this_month:true, bought:false, added_by:me||'', note:'', link:'', recurring_cost:0, quantity:1}));
    const {error}=await sb.from('buylist_items').insert(rows);
    if(error) setStatus('批次新增失敗：'+error.message,'err');
    else { $('bl-bulk').value=''; setStatus('已加入 '+rows.length+' 筆','live'); }
    bulking=false;
  }
  async function toggleBought(id,val){const {error}=await sb.from('buylist_items').update({bought:val}).eq('id',id);if(error)setStatus('更新失敗：'+error.message,'err');}
  async function toggleStarred(id,val){const {error}=await sb.from('buylist_items').update({starred:val}).eq('id',id);if(error)setStatus('更新失敗：'+error.message,'err');}
  async function delItem(id){const {error}=await sb.from('buylist_items').delete().eq('id',id);if(error)setStatus('刪除失敗：'+error.message,'err');}
  async function saveBudget(v){budget=+v||0;const {error}=await sb.from('buylist_budget').upsert({id:1,monthly_budget:budget});if(error)setStatus('預算儲存失敗：'+error.message,'err');}

  // ── 貼連結自動帶入：呼叫 Gemini 讀商品頁，抽出名稱+價格填進表單（不自動送出，讓使用者確認後再按加入）──
  let importing=false;
  async function importFromLink(){
    if(importing) return;
    const url=($('bl-link').value||'').trim();
    if(!url){ setStatus('請先把商品連結貼到「連結」欄','err'); $('bl-link').focus(); return; }
    if(!GEMINI_KEY){ setStatus('尚未設定 Gemini 金鑰（buylist/config.js）','err'); return; }
    importing=true;
    const btn=$('bl-import'), old=btn.textContent;
    btn.disabled=true; btn.textContent='讀取中…'; setStatus('讀取商品資訊中…','');
    try{
      const prompt='你是購物助手。請讀取這個商品網址的內容，抽出「商品名稱」與「售價」。\n網址：'+url+
        '\n只回一個 JSON 物件，不要 markdown、不要多餘文字，格式：{"name":"商品名稱（簡潔、去掉行銷贅字）","price":售價數字}。'+
        'price 請填新台幣整數；若原頁是外幣請概略換算成台幣；抓不到價格就填 0。若讀不到該頁，name 盡量從網址推斷、price 填 0。';
      const body={contents:[{parts:[{text:prompt}]}],tools:[{url_context:{}}]};
      const resp=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+GEMINI_MODEL+':generateContent?key='+encodeURIComponent(GEMINI_KEY),
        {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!resp.ok){ const t=await resp.text(); throw new Error('API '+resp.status+'：'+t.slice(0,120)); }
      const data=await resp.json();
      const cand=(data.candidates&&data.candidates[0])||{};
      const parts=(cand.content&&cand.content.parts)||[];
      const text=parts.map(p=>(p&&p.text)||'').join('');
      const m=text.match(/\{[\s\S]*\}/);
      if(!m) throw new Error('無法解析回應');
      const obj=JSON.parse(m[0]);
      if(obj.name) $('bl-name').value=String(obj.name).trim();
      if(+obj.price>0) $('bl-price').value=Math.round(+obj.price);
      setStatus('已帶入，請確認後按「＋ 加入」','live');
      $('bl-name').focus();
    }catch(e){
      setStatus('抓取失敗：'+e.message,'err');
    }finally{
      importing=false; btn.disabled=false; btn.textContent=old;
    }
  }

  // ── 事件 ──
  $('bl-add').addEventListener('click',addItem);
  $('bl-bulk-add').addEventListener('click',bulkAdd);
  $('bl-import').addEventListener('click',importFromLink);
  $('bl-name').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();addItem();}});
  $('seg-urg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;addUrg=b.dataset.v;$('seg-urg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});
  $('seg-acc').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;addAcc=b.dataset.v;$('seg-acc').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});
  $('bl-budget').addEventListener('change',e=>saveBudget(e.target.value));
  $('bl-budget').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
  $('whoSel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;me=b.dataset.me;localStorage.setItem('buylist_me',me);renderWho();});
  $('f-status').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;fStatus=b.dataset.v;$('f-status').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderList();});
  $('f-cat').addEventListener('change',e=>{fCat=e.target.value;renderList();});
  $('f-tag').addEventListener('change',e=>{fTag=e.target.value;renderList();});
  $('f-sort').addEventListener('change',e=>{fSort=e.target.value;renderList();});
  $('viewtabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.view;
    document.querySelectorAll('#viewtabs button').forEach(x=>x.classList.toggle('on',x===b));
    $('view-list').classList.toggle('hidden',view!=='list');$('view-matrix').classList.toggle('hidden',view!=='matrix');});

  // ── 即時訂閱 ──
  sb.channel('buylist-all')
    .on('postgres_changes',{event:'*',schema:'public',table:'buylist_items'},loadAll)
    .on('postgres_changes',{event:'*',schema:'public',table:'buylist_budget'},loadAll)
    .subscribe(st=>{ if(st==='SUBSCRIBED')setStatus('即時同步已連線','live'); else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')setStatus('即時連線異常：'+st,'err'); });

  renderWho(); loadAll();
})();
</script>
</body>
