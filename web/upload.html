<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上傳附件 — Scout</title>
<!-- 獨立頁，刻意不載入 shell.css / checklist.css：
     這頁要在手機上、可能在訊號很差的地方打開，載得越少越好。 -->
<style>
  :root{ --bg:#F5F0EA; --card:#fff; --text:#3C3830; --muted:#6B6558;
         --brand:#3D6B54; --brand-d:#2A4D3A; --border:#C2DDD1; --err:#B23B2E; --err-soft:#FBE4E0; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
       font-size:16px;line-height:1.6;padding:16px}
  .wrap{max-width:560px;margin-inline:auto}
  h1{font-size:1.25rem;margin:.2rem 0 .2rem}
  .sub{color:var(--muted);font-size:.85rem;margin:0 0 1rem}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:.9rem}
  label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.25rem}
  input,select{width:100%;font:inherit;padding:.6rem .7rem;border:1px solid var(--border);
               border-radius:8px;background:#fff;color:var(--text);margin-bottom:.7rem}
  /* 手機上這是主要動作，做大一點，單手按得到 */
  button{width:100%;font:inherit;font-weight:700;padding:.8rem;border:0;border-radius:999px;
         background:var(--brand);color:#fff;cursor:pointer}
  button:disabled{opacity:.5}
  button.ghost{background:transparent;color:var(--brand);border:1px solid var(--border);margin-top:.5rem}
  .msg{margin-top:.7rem;font-size:.9rem;padding:.6rem .7rem;border-radius:8px;display:none}
  .msg.on{display:block}
  .msg.err{background:var(--err-soft);color:var(--err)}
  .msg.ok{background:#EAF2ED;color:var(--brand-d)}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;justify-content:space-between;gap:.6rem;align-items:center;
     padding:.55rem 0;border-bottom:1px dashed var(--border);font-size:.9rem}
  li:last-child{border-bottom:0}
  li a{color:var(--brand);font-weight:600;text-decoration:none;word-break:break-all}
  li small{color:var(--muted);white-space:nowrap}
  a.del{color:var(--err);margin-left:.4rem}
  .hint{font-size:.8rem;color:var(--muted);margin-top:.6rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>上傳附件</h1>
  <p class="sub">訂房確認、機票、收據的截圖或 PDF。上傳後會出現在行程表裡，
     重新建置時會嵌進離線單檔，飛機上也看得到。</p>

  <div class="card">
    <label for="key">上傳金鑰</label>
    <input id="key" type="password" autocomplete="current-password" placeholder="跟 Stanley 要">
    <label for="trip">旅程</label>
    <select id="trip"><option value="">載入中…</option></select>
    <label for="label">這是什麼（選填）</label>
    <input id="label" type="text" placeholder="例如：Oriens 訂房確認">
    <label for="file">檔案（可多選，單檔上限 24 MB）</label>
    <input id="file" type="file" multiple accept="image/*,application/pdf">
    <button id="go">上傳</button>
    <div id="msg" class="msg"></div>
    <p class="hint">金鑰會記在這支手機的瀏覽器裡，下次不用再輸入。</p>
  </div>

  <div class="card">
    <strong>已上傳</strong>
    <ul id="list"><li><small>輸入金鑰後會列出來</small></li></ul>
    <button class="ghost" id="refresh">重新整理清單</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var KEYSTORE = "scout-upload-key";

  // 金鑰記在瀏覽器，不放網址——網址會留在歷史紀錄和分享連結裡
  try { $("key").value = localStorage.getItem(KEYSTORE) || ""; } catch (e) {}
  // 旅程清單從部署出去的 trips/index.json 讀——手打資料夾名稱既難記又容易錯
  var wantTrip = "";
  try { wantTrip = localStorage.getItem("scout-upload-trip") || ""; } catch (e) {}
  fetch("trips/index.json")
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (rows) {
      var sel = $("trip");
      if (!rows.length) { sel.innerHTML = "<option value=''>（還沒有建置過的行程表）</option>"; return; }
      sel.innerHTML = rows.map(function (t) {
        var label = (t.title || t.city || t.slug) + "（" + (t.start_date || "") + "）";
        return "<option value='" + esc(t.slug) + "'>" + esc(label) + "</option>";
      }).join("");
      if (wantTrip) sel.value = wantTrip;
      if (!sel.value) sel.selectedIndex = 0;
      if ($("key").value) list();
    })
    .catch(function () { $("trip").innerHTML = "<option value=''>（讀不到旅程清單）</option>"; });

  function say(text, kind) {
    var m = $("msg");
    m.textContent = text;
    m.className = "msg on " + (kind || "");
  }

  function headers() { return { "X-Scout-Key": $("key").value.trim() }; }

  function list() {
    var trip = $("trip").value.trim();
    if (!$("key").value.trim() || !trip) return;
    fetch("/api/attachments?trip=" + encodeURIComponent(trip), { headers: headers() })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        var ul = $("list");
        if (!res.ok) { ul.innerHTML = "<li><small>" + esc(res.d.error || "讀不到") + "</small></li>"; return; }
        var items = res.d.items || [];
        if (!items.length) { ul.innerHTML = "<li><small>這趟還沒有附件</small></li>"; return; }
        ul.innerHTML = items.map(function (it) {
          var kb = it.size ? Math.max(1, Math.round(it.size / 1024)) + " KB" : "";
          // 這個連結帶著金鑰，方便直接點開看；它是私人連結，不要轉傳
          var href = "/api/attachments/" + encodeURIComponent(it.id)
                   + "?k=" + encodeURIComponent($("key").value.trim());
          return "<li><a href='" + href + "' target='_blank' rel='noopener'>"
               + esc(it.label || it.name || it.id) + "</a><small>" + esc(kb)
               + " <a href='#' class='del' data-id='" + esc(it.id) + "'>刪除</a></small></li>";
        }).join("");
      })
      .catch(function () { $("list").innerHTML = "<li><small>連不上伺服器</small></li>"; });
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  $("go").addEventListener("click", function () {
    var files = $("file").files;
    var key = $("key").value.trim();
    var trip = $("trip").value.trim();
    if (!key) { say("先填上傳金鑰。", "err"); return; }
    if (!trip) { say("先選旅程。", "err"); return; }
    if (!files || !files.length) { say("還沒選檔案。", "err"); return; }
    try { localStorage.setItem(KEYSTORE, key); localStorage.setItem("scout-upload-trip", trip); } catch (e) {}

    $("go").disabled = true;
    var done = 0, failed = [];
    // 一個一個傳：手機網路不穩時，失敗的那個才要重傳，不是整批重來
    var next = function (i) {
      if (i >= files.length) {
        $("go").disabled = false;
        $("file").value = "";
        if (failed.length) say("上傳 " + done + " 個，失敗 " + failed.length + " 個：" + failed.join("、"), "err");
        else say("上傳成功，共 " + done + " 個。", "ok");
        list();
        return;
      }
      var fd = new FormData();
      fd.append("trip", trip);
      fd.append("label", $("label").value.trim());
      fd.append("file", files[i]);
      say("上傳中 " + (i + 1) + " / " + files.length + "…");
      fetch("/api/attachments", { method: "POST", headers: headers(), body: fd })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (res.ok) done++; else failed.push(files[i].name + "（" + (res.d.error || "失敗") + "）");
          next(i + 1);
        })
        .catch(function () { failed.push(files[i].name + "（連不上）"); next(i + 1); });
    };
    next(0);
  });

  // 刪除：傳錯一張截圖卻只能永遠留著，是壞設計。刪除要二次確認，避免手機誤觸
  $("list").addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a.del") : null;
    if (!a) return;
    e.preventDefault();
    if (!window.confirm("刪除這個附件？不能復原。")) return;
    fetch("/api/attachments/" + encodeURIComponent(a.dataset.id),
          { method: "DELETE", headers: headers() })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) { say(res.ok ? "已刪除。" : (res.d.error || "刪不掉"), res.ok ? "ok" : "err"); list(); })
      .catch(function () { say("連不上伺服器。", "err"); });
  });

  $("trip").addEventListener("change", list);
  $("refresh").addEventListener("click", list);
  if ($("key").value) list();
})();
</script>
</body>
</html>
