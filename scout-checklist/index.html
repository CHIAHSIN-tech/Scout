<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <!-- 手機優先：固定視窗寬度、禁止縮放抖動 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scout 確認清單</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="app">
        <!-- 內容由 app.js 動態渲染 -->
        <div id="status" class="status">載入中…</div>
    </main>

    <!-- ── AI 匯入行程 modal（預設隱藏）── -->
    <div id="ai-import-backdrop" class="ai-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="ai-import-title">
      <div class="ai-modal">
        <div class="ai-modal-head">
          <div id="ai-import-title" class="ai-modal-title">✨ AI 匯入行程</div>
          <button type="button" id="ai-import-close" class="ai-modal-x" aria-label="關閉">✕</button>
        </div>
        <div class="ai-modal-hint">貼上一段文字行程（部落格、訊息、備忘錄都行），AI 會抓出景點/餐廳/時間並排入行程。</div>
        <textarea id="ai-import-text" class="ai-textarea" rows="8"
          placeholder="例如：&#10;Day 1 上午 10:00 到美麗海水族館，中午在本部町吃海鮮，晚上 18:30 國際通燒肉…"></textarea>
        <div id="ai-import-msg" class="ai-msg" aria-live="polite"></div>
        <div class="ai-modal-actions">
          <button type="button" id="ai-import-cancel" class="ai-btn-ghost">取消</button>
          <button type="button" id="ai-import-run" class="ai-btn-primary">解析並加入</button>
        </div>
      </div>
    </div>

    <!-- 設定檔（Supabase URL / anon key / Gemini key）。複製 config.example.js → config.js 後填入。 -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
